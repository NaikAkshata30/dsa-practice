name: Update DSA Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "800-level/**/*.py"
      - "scripts/generate_activity.py"
      - ".github/workflows/update-dsa-dashboard.yml"

  schedule:
    - cron: "30 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dsa-dashboard
  cancel-in-progress: true

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate activity dashboard
        run: python scripts/generate_activity.py

      - name: Commit updated dashboard
        run: |
          if git diff --quiet -- assets/daily-activity.svg; then
            echo "Dashboard is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/daily-activity.svg
          git commit -m "Update DSA activity dashboard"
          git push