name: Update DSA Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "800-level/**"
      - "scripts/**"
      - ".github/workflows/update-dsa-dashboard.yml"

  schedule:
    # Runs every day at 00:30 UTC = 06:00 AM IST
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate activity heatmap
        run: |
          python scripts/generate_activity.py

      - name: Generate Codeforces analytics
        run: |
          python scripts/generate_dashboard.py

      - name: Check generated files
        run: |
          git status
          git diff --stat

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update Codeforces dashboard"
            git push
          fi